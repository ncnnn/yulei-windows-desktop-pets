name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build onedir
        shell: pwsh
        run: ./scripts/build_onedir.ps1 -Python python

      - name: Build portable zip
        shell: pwsh
        run: ./scripts/make_portable_zip.ps1 -Python python -Version ${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "packaging\leiyu.iss"

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $files = @(
            "dist\installer\LeiYu-Desktop-Pets-Windows-v$version-x64-setup.exe",
            "LeiYu-Desktop-Pets-Windows-$version-x64-portable.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.ver.outputs.version }}"
          $assets = @(
            "dist\installer\LeiYu-Desktop-Pets-Windows-v$version-x64-setup.exe",
            "LeiYu-Desktop-Pets-Windows-$version-x64-portable.zip",
            "SHA256SUMS.txt"
          )

          # 从 CHANGELOG 抽取本版本的「新增/修复」正文，直接作为发布说明。
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = '(?ms)^##[ \t]+v' + [regex]::Escape($version) + '[ \t]*\r?\n(.*?)(?=^##[ \t]+v|\z)'
          $sectionMatch = [regex]::Match($changelog, $pattern)
          $section = if ($sectionMatch.Success) {
            $sectionMatch.Groups[1].Value.Trim()
          } else {
            "详细变更见 CHANGELOG.md。"
          }

          $notes = @"
          $section

          ---

          **下载**

          - 安装版：`LeiYu-Desktop-Pets-Windows-v$version-x64-setup.exe`（装到 `%LOCALAPPDATA%\Programs\LeiYuDesktopPets`，无需管理员权限）
          - 便携版：`LeiYu-Desktop-Pets-Windows-$version-x64-portable.zip`（解压即用，数据写在同目录 `data\`）
          - 校验：`SHA256SUMS.txt`

          **素材版权**：随包头像与音频不在 MIT 许可范围内，版权归原权利人所有；本项目仅用于学习交流与玩梗，不用于商业用途；权利人如认为使用不当，可在仓库开 issue，我们会及时移除。

          **安装包未做代码签名**，Windows SmartScreen 可能提示，请选择“更多信息 → 仍要运行”。

          **免安装版如双击没反应**：压缩包从网络下载后 Windows 会写入「锁定」标记，请右键 `leiyu_pet.exe` → 属性 → 常规 → 勾选「解除锁定」→ 应用，再运行。
          "@

          $notesPath = Join-Path $PWD "RELEASE_NOTES.md"
          [IO.File]::WriteAllText($notesPath, $notes, (New-Object System.Text.UTF8Encoding($false)))
          gh release create $tag $assets --title "v$version" --notes-file $notesPath
